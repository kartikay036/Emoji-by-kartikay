<!DOCTYPE html> 
<html> 
<head>

 <title>emoji</title> 
 <style type="text/css">

   height: 400px; 
   width: 400px; 
   border: 7px solid black; 
   border-radius: 50%; 
   background-color: yellow; 
   position: relative; 
  } 
  .a{ 
   height: 60px; 
   width: 60px; 
   border: 3px solid black; 
   border-radius: 60%; 
   background-color: red; 
            top: 10%; 
            left: 25%; 
            position: absolute; 
  } 
  .a1{ 
   height: 60px; 
   width: 60px; 
   border: 3px solid black; 
   border-radius: 60%; 
   background-color: red; 
   top: 10%; 
            right: 25%; 
            position: absolute; 
  } 
  .a2{ 
   height: 50px; 
   width: 200px; 
   border: 2px solid black; 
   border-radius: 60%; 
   background-color: orange; 
   top: 80%; 
            left: 25%; 
            position: absolute; 
  } 
 </style> 
</head> 
<body> 
    <div class="circle"> 
        <div class="a"></div> 
        <div class="a1"></div> 
        <div class="a2"></div> 
    </div> 
</body> 
</html>
